# Domy?lnie szuka lokalnie (dla IntelliJ)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campus_gear_db}
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Konfiguracja Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Monitoring: Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Campus Gear
info.app.description=System wypożyczania sprzętu uczelnianego

# Poczta (lokalnie i w Dockerze: Mailpit; na produkcji podmienić na prawdziwy SMTP)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
notifications.mail.from=wypozyczalnia@campus.edu.pl
notifications.reminder.days-before=2
notifications.reminder.cron=0 0 8 * * *