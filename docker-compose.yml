services:
  postgres-db:
    image: postgres:16-alpine
    container_name: campus-gear-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=campus_gear_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # Sprawdza, czy Postgres na pewno już działa i przyjmuje połączenia
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_gear_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-app:
    build: .
    container_name: campus-gear-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/campus_gear_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=mysecretpassword
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck: # Zdrowie backendu po Actuatorze (bez JWT)
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: campus-gear-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      backend-app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: campus-gear-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata: